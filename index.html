    <script>
      // Ensure window.fetch has both getter and setter so browser extensions can intercept without throwing errors
      (function() {
        try {
          var _origFetch = window.fetch;
          if (_origFetch) {
            var _curFetch = _origFetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return _curFetch; },
              set: function(v) { _curFetch = v; }
            });
          }
        } catch (_) {}

        // Suppress external browser extension script errors from bubbling up to dev overlay
        window.addEventListener('error', function(e) {
          if (e.filename && (e.filename.startsWith('chrome-extension://') || e.filename.startsWith('moz-extension://'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var stack = (e.reason && e.reason.stack) ? e.reason.stack : '';
          if (typeof stack === 'string' && (stack.includes('chrome-extension://') || stack.includes('moz-extension://'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
